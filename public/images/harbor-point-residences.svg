<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Waterfront residential tower at dusk">
  <defs>
    <linearGradient id="hp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071a2b"/>
      <stop offset="55%" stop-color="#112d4d"/>
      <stop offset="100%" stop-color="#183c66"/>
    </linearGradient>
    <linearGradient id="hp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d686"/>
      <stop offset="100%" stop-color="#c6952c"/>
    </linearGradient>
    <linearGradient id="hp-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2744"/>
      <stop offset="100%" stop-color="#071a2b"/>
    </linearGradient>
    <radialGradient id="hp-glow" cx="0.72" cy="0.22" r="0.42">
      <stop offset="0%" stop-color="#f2d686" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f2d686" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#hp-sky)"/>
  <rect width="1200" height="800" fill="url(#hp-glow)"/>
  <circle cx="864" cy="176" r="58" fill="url(#hp-gold)" opacity="0.85"/>

  <!-- distant skyline -->
  <g fill="#071a2b" opacity="0.55">
    <rect x="60" y="430" width="86" height="200"/>
    <rect x="166" y="470" width="64" height="160"/>
    <rect x="960" y="452" width="92" height="178"/>
    <rect x="1072" y="492" width="68" height="138"/>
  </g>

  <!-- primary tower -->
  <rect x="470" y="196" width="196" height="434" fill="#0b2340"/>
  <rect x="470" y="196" width="196" height="434" fill="none" stroke="#f2d686" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="686" y="288" width="128" height="342" fill="#0d2744"/>
  <rect x="330" y="330" width="124" height="300" fill="#0d2744"/>

  <!-- lit windows -->
  <g fill="#f2d686">
    <g opacity="0.9">
      <rect x="498" y="240" width="26" height="16"/><rect x="546" y="240" width="26" height="16"/><rect x="594" y="240" width="26" height="16"/>
      <rect x="498" y="296" width="26" height="16"/><rect x="594" y="296" width="26" height="16"/>
      <rect x="546" y="352" width="26" height="16"/><rect x="594" y="352" width="26" height="16"/>
      <rect x="498" y="408" width="26" height="16"/><rect x="546" y="408" width="26" height="16"/>
      <rect x="594" y="464" width="26" height="16"/>
      <rect x="498" y="520" width="26" height="16"/><rect x="546" y="520" width="26" height="16"/>
    </g>
    <g opacity="0.55">
      <rect x="712" y="330" width="22" height="14"/><rect x="756" y="330" width="22" height="14"/>
      <rect x="712" y="392" width="22" height="14"/><rect x="756" y="454" width="22" height="14"/>
      <rect x="712" y="516" width="22" height="14"/>
      <rect x="356" y="372" width="22" height="14"/><rect x="400" y="434" width="22" height="14"/>
      <rect x="356" y="496" width="22" height="14"/><rect x="400" y="558" width="22" height="14"/>
    </g>
  </g>

  <!-- waterline -->
  <rect x="0" y="630" width="1200" height="170" fill="url(#hp-water)"/>
  <g stroke="#f2d686" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
    <path d="M540 672h96"/><path d="M508 706h160"/><path d="M556 740h64"/>
    <path d="M724 690h72"/><path d="M366 718h88"/>
  </g>
  <rect x="0" y="628" width="1200" height="3" fill="#f2d686" opacity="0.45"/>
</svg>
