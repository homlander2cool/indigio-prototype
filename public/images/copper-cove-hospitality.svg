<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mountain resort lodge beneath alpine peaks">
  <defs>
    <linearGradient id="cc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071a2b"/>
      <stop offset="60%" stop-color="#153453"/>
      <stop offset="100%" stop-color="#22506f"/>
    </linearGradient>
    <linearGradient id="cc-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ddc6"/>
      <stop offset="45%" stop-color="#5c7590"/>
      <stop offset="100%" stop-color="#0d2744"/>
    </linearGradient>
    <linearGradient id="cc-peak-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbbfa6"/>
      <stop offset="40%" stop-color="#42607d"/>
      <stop offset="100%" stop-color="#0b2340"/>
    </linearGradient>
    <linearGradient id="cc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d686"/>
      <stop offset="100%" stop-color="#c6952c"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx="0.24" cy="0.18" r="0.4">
      <stop offset="0%" stop-color="#f2d686" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f2d686" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cc-sky)"/>
  <rect width="1200" height="800" fill="url(#cc-glow)"/>
  <circle cx="286" cy="150" r="46" fill="url(#cc-gold)" opacity="0.9"/>

  <!-- back ridge -->
  <path d="M0 560 L210 300 L360 470 L530 250 L760 540 L900 400 L1200 620 L1200 800 L0 800Z" fill="url(#cc-peak-2)" opacity="0.75"/>
  <!-- front peaks -->
  <path d="M120 800 L470 250 L820 800Z" fill="url(#cc-peak)"/>
  <path d="M600 800 L900 340 L1200 800Z" fill="url(#cc-peak-2)"/>
  <!-- snow caps -->
  <path d="M470 250 L540 360 L500 348 L462 392 L430 344 L398 360Z" fill="#f6f1e4" opacity="0.92"/>
  <path d="M900 340 L954 428 L920 416 L892 452 L866 414 L842 428Z" fill="#f6f1e4" opacity="0.85"/>

  <!-- treeline -->
  <g fill="#071a2b" opacity="0.85">
    <path d="M96 800 L128 690 L160 800Z"/><path d="M170 800 L198 706 L226 800Z"/>
    <path d="M1010 800 L1042 700 L1074 800Z"/><path d="M1084 800 L1112 718 L1140 800Z"/>
  </g>

  <!-- lodge -->
  <g>
    <path d="M430 604 L570 524 L710 604 L710 620 L430 620Z" fill="#0b2340"/>
    <rect x="452" y="612" width="236" height="128" fill="#0d2744"/>
    <rect x="452" y="612" width="236" height="128" fill="none" stroke="#f2d686" stroke-opacity="0.3" stroke-width="2"/>
    <g fill="#f2d686">
      <rect x="482" y="644" width="34" height="30" opacity="0.92"/>
      <rect x="536" y="644" width="34" height="30" opacity="0.85"/>
      <rect x="590" y="644" width="34" height="30" opacity="0.92"/>
      <rect x="644" y="644" width="26" height="30" opacity="0.7"/>
      <rect x="548" y="700" width="46" height="40" opacity="0.95"/>
    </g>
    <!-- warm light spill -->
    <path d="M548 740 L512 800 L640 800 L594 740Z" fill="#f2d686" opacity="0.16"/>
  </g>

  <rect x="0" y="740" width="1200" height="60" fill="#071a2b" opacity="0.55"/>
</svg>
